name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: ragops
          POSTGRES_PASSWORD: ragops
          POSTGRES_DB: ragops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ragops -d ragops_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies (ONNX runtime, no PyTorch, same as production)
        run: pip install -r requirements.txt pytest pyflakes
      - name: Static check (fail only on undefined names / syntax errors)
        run: |
          python -m pyflakes app > pyflakes.txt || true
          if grep -E "undefined name|syntax error|invalid syntax" pyflakes.txt; then exit 1; fi
      - name: Tests (Postgres + pgvector)
        env:
          TEST_DATABASE_URL: postgresql://ragops:ragops@localhost:5432/ragops_test
        run: python -m pytest tests -q
      - name: Tests (SQLite)
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: "Lint (reported, not yet blocking - pre-existing strictness debt)"
        run: npx eslint .
        continue-on-error: true
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
        run: npm run build
